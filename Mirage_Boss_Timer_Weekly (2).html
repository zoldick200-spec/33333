<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirage Boss Spawn Timer</title>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --success: #10b981;
            --star-color: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .timezone-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .timezone-bar label {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .timezone-bar select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent);
        }

        .search-bar {
            margin-bottom: 16px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #334155;
            color: #fff;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: var(--card-bg);
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr.completed {
            opacity: 0.5;
        }

        .checkbox-cell, .star-cell {
            text-align: center;
        }

        .checkbox-cell input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.1s, color 0.2s;
        }

        .star-btn:hover {
            transform: scale(1.2);
        }

        .star-btn.favorited {
            color: var(--star-color);
        }

        .schedule-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .time-badge {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .cd {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
        }

        .cd.imminent {
            color: var(--warning);
            animation: pulse 1s infinite alternate;
        }

        .cd.due {
            color: var(--danger);
            animation: pulse 0.6s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        .action-btn:hover {
            color: var(--accent);
        }

        .action-btn.del:hover {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
        }

        .reset-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🐉 Mirage Boss Spawn Timer</h1>
        <p class="subtitle">Track boss spawn times and countdowns in real-time (Powered by Supabase)</p>
    </header>

    <!-- Timezone Selection Bar -->
    <div class="timezone-bar">
        <label for="tzSelect">🌐 Target Timezone:</label>
        <select id="tzSelect" onchange="changeTimezone()">
            <option value="8">Asia (UTC +8)</option>
            <option value="-3">South America (UTC -3)</option>
        </select>
    </div>

    <div class="card">
        <form id="bossForm" onsubmit="addBoss(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="b">Boss Name</label>
                    <input id="b" placeholder="e.g. Mirage Dragon" required>
                </div>
                <div class="form-group">
                    <label for="w">World / Server</label>
                    <input id="w" placeholder="e.g. World 1" required>
                </div>
                <div class="form-group">
                    <label for="l">Location</label>
                    <input id="l" placeholder="e.g. Desert Oasis" required>
                </div>
                <div class="form-group">
                    <label for="t">Spawn Times (Comma separated)</label>
                    <input id="t" placeholder="e.g. 2:00 PM, 8:00 PM" required>
                </div>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="exportImportModal()">Backup / Load</button>
                <button type="submit" class="btn">Add Boss</button>
            </div>
        </form>
    </div>

    <div class="search-bar">
        <input id="search" placeholder="🔍 Search boss, world, location..." oninput="searchBoss()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: center;">⭐</th>
                    <th style="text-align: center;">Done</th>
                    <th>Boss</th>
                    <th>World</th>
                    <th>Location</th>
                    <th>All Spawn Times (Selected TZ)</th>
                    <th>Next Spawn</th>
                    <th>Countdown</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tb">
            </tbody>
        </table>
    </div>
    <div class="reset-info">💡 Checkbox auto-resets every Sunday at 11:00 PM GMT+8</div>
</div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://gaxxvcfoogwphytvluzb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdheHh2Y2Zvb2d3cGh5dHZsdXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MzY5MzEsImV4cCI6MjEwMDQxMjkzMX0.qVbiVwPyxj7dkeunCnwash3P-STKb1jf51VR2ZxfDJc';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let bosses = [];
let currentOffset = 8; // Default to UTC +8 (Asia)

function changeTimezone() {
    const select = document.getElementById('tzSelect');
    currentOffset = parseInt(select.value, 10);
    render();
}

async function loadBosses() {
    const { data, error } = await supabaseClient
        .from('bosses')
        .select('*')
        .order('id', { ascending: true });

    if (error) {
        console.error('Error loading bosses from Supabase:', error);
        return;
    }

    bosses = data || [];
    render();
}

function subscribeToRealtime() {
    supabaseClient
        .channel('public:bosses')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bosses' }, () => {
            loadBosses();
        })
        .subscribe();
}

function getLastResetTimestamp() {
    let now = new Date();
    let utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
    let gmt8Date = new Date(utcMs + (8 * 3600000));
    
    let day = gmt8Date.getDay();
    let hours = gmt8Date.getHours();
    
    let daysToSubtract = day;
    if (day === 0 && hours < 23) {
        daysToSubtract = 7;
    }
    
    let lastResetGMT8 = new Date(gmt8Date);
    lastResetGMT8.setDate(gmt8Date.getDate() - daysToSubtract);
    lastResetGMT8.setHours(23, 0, 0, 0);
    
    return lastResetGMT8.getTime() - (8 * 3600000) - (now.getTimezoneOffset() * 60000);
}

function parseTimeToTargetTZ(timeStr, targetOffsetHours) {
    if (!timeStr) return null;
    let match = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if (!match) return null;

    let [, hoursStr, minutesStr, period] = match;
    let hours = parseInt(hoursStr, 10);
    let minutes = parseInt(minutesStr, 10);

    if (isNaN(hours) || isNaN(minutes) || hours < 0 || hours > 23 || minutes < 0 || minutes > 59) {
        return null;
    }

    if (period) {
        period = period.toUpperCase();
        if (period === 'PM' && hours < 12) hours += 12;
        if (period === 'AM' && hours === 12) hours = 0;
    }

    let baseDate = new Date();
    baseDate.setUTCHours(hours - 8, minutes, 0, 0);

    let targetDate = new Date(baseDate.getTime() + (targetOffsetHours * 3600000));
    return targetDate;
}

function formatTimeInTargetTZ(dateObj, targetOffsetHours) {
    let shifted = new Date(dateObj.getTime() + ((targetOffsetHours - 8) * 3600000));
    let hours = shifted.getUTCHours();
    let minutes = shifted.getUTCMinutes();
    let period = hours >= 12 ? 'PM' : 'AM';
    let formattedHours = hours % 12 || 12;
    let formattedMinutes = String(minutes).padStart(2, '0');
    return `${formattedHours}:${formattedMinutes} ${period}`;
}

function render() {
    const tb = document.getElementById('tb');
    tb.innerHTML = '';

    if (bosses.length === 0) {
        tb.innerHTML = `<tr><td colspan="9" class="empty-state">No bosses added yet. Add one using the form above!</td></tr>`;
        return;
    }

    const lastReset = getLastResetTimestamp();

    bosses.forEach((x, i) => {
        if (x.done && x.lastChecked && x.lastChecked < lastReset) {
            x.done = false;
            x.lastChecked = null;
            supabaseClient
                .from('bosses')
                .update({ done: false, lastChecked: null })
                .eq('id', x.id);
        }
    });

    bosses.forEach((x, i) => {
        let convertedTimesArray = (x.times || '')
            .split(',')
            .map(t => t.trim())
            .filter(Boolean)
            .map(t => {
                let parsedDate = parseTimeToTargetTZ(t, currentOffset);
                return parsedDate ? formatTimeInTargetTZ(parsedDate, currentOffset) : t;
            });

        const timesBadges = convertedTimesArray
            .map(t => `<span class="time-badge">${escapeHtml(t)}</span>`)
            .join('');

        let r = tb.insertRow();
        r.dataset.index = i;
        r.dataset.id = x.id;
        r.dataset.rawtimes = x.times;
        r.dataset.favorite = x.favorite ? 'true' : 'false';
        if (x.done) r.classList.add('completed');

        r.innerHTML = `
            <td class="star-cell">
                <button class="star-btn ${x.favorite ? 'favorited' : ''}" onclick="toggleFavorite(${i}, this)">
                    ${x.favorite ? '★' : '☆'}
                </button>
            </td>
            <td class="checkbox-cell">
                <input type="checkbox" ${x.done ? 'checked' : ''} onchange="toggleDone(${i}, this.checked)">
            </td>
            <td><strong>${escapeHtml(x.b)}</strong></td>
            <td>${escapeHtml(x.w)}</td>
            <td>${escapeHtml(x.l)}</td>
            <td><div class="schedule-tags">${timesBadges || '-'}</div></td>
            <td class="next">-</td>
            <td class="cd">-</td>
            <td class="actions">
                <button class="action-btn" onclick="editBoss(${i})">Edit</button>
                <button class="action-btn del" onclick="delBoss(${i})">Delete</button>
            </td>
        `;
    });
    
    update();
}

async function toggleFavorite(index, btnElement) {
    let boss = bosses[index];
    boss.favorite = !boss.favorite;

    if (boss.favorite) {
        btnElement.textContent = '★';
        btnElement.classList.add('favorited');
    } else {
        btnElement.textContent = '☆';
        btnElement.classList.remove('favorited');
    }

    let row = document.querySelector(`#tb tr[data-index="${index}"]`);
    if (row) {
        row.dataset.favorite = boss.favorite ? 'true' : 'false';
    }

    const { error } = await supabaseClient
        .from('bosses')
        .update({ favorite: boss.favorite })
        .eq('id', boss.id);

    if (error) {
        console.error('Failed to update favorite status:', error);
    } else {
        update();
    }
}

async function toggleDone(index, isChecked) {
    let boss = bosses[index];
    let lastChecked = isChecked ? Date.now() : null;

    boss.done = isChecked;
    boss.lastChecked = lastChecked;

    let row = document.querySelector(`#tb tr[data-index="${index}"]`);
    if (row) {
        if (isChecked) row.classList.add('completed');
        else row.classList.remove('completed');
    }

    const { error } = await supabaseClient
        .from('bosses')
        .update({ done: isChecked, lastChecked: lastChecked })
        .eq('id', boss.id);

    if (error) {
        console.error('Failed to update boss status:', error);
    }
}

function searchBoss() {
    let q = document.getElementById('search').value.toLowerCase();
    let rows = document.querySelectorAll('#tb tr');
    rows.forEach(r => {
        let text = r.textContent.toLowerCase();
        r.style.display = text.includes(q) ? '' : 'none';
    });
}

function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function addBoss(e) {
    e.preventDefault();
    const bInput = document.getElementById('b');
    const wInput = document.getElementById('w');
    const lInput = document.getElementById('l');
    const tInput = document.getElementById('t');

    let rawVals = tInput.value.split(',');
    let vals = [];

    rawVals.forEach(v => {
        v = v.trim();
        if (!v) return;
        if (/am|pm/i.test(v)) {
            vals.push(v);
        } else {
            vals.push(v + ' AM');
            vals.push(v + ' PM');
        }
    });

    const newBoss = {
        b: bInput.value.trim(),
        w: wInput.value.trim(),
        l: lInput.value.trim(),
        times: vals.join(', '),
        done: false,
        favorite: false,
        lastChecked: null
    };

    const { data, error } = await supabaseClient
        .from('bosses')
        .insert([newBoss])
        .select();

    if (error) {
        console.error('Error adding boss:', error);
        alert('Failed to save boss to Supabase.');
        return;
    }

    bosses.push(data[0]);
    render();

    bInput.value = '';
    wInput.value = '';
    lInput.value = '';
    tInput.value = '';
}

async function editBoss(i) {
    let x = bosses[i];
    let nb = prompt('Boss Name:', x.b); if (nb === null) return;
    let nw = prompt('World / Server:', x.w); if (nw === null) return;
    let nl = prompt('Location:', x.l); if (nl === null) return;
    let nt = prompt('Spawn Times (comma-separated):', x.times); if (nt === null) return;

    const updatedBoss = {
        b: nb.trim(),
        w: nw.trim(),
        l: nl.trim(),
        times: nt.trim()
    };

    const { error } = await supabaseClient
        .from('bosses')
        .update(updatedBoss)
        .eq('id', x.id);

    if (error) {
        console.error('Error editing boss:', error);
        alert('Failed to update boss in Supabase.');
        return;
    }

    bosses[i] = { ...bosses[i], ...updatedBoss };
    render();
}

async function delBoss(i) {
    let x = bosses[i];
    if (confirm(`Delete ${x.b}?`)) {
        const { error } = await supabaseClient
            .from('bosses')
            .delete()
            .eq('id', x.id);

        if (error) {
            console.error('Error deleting boss:', error);
            alert('Failed to delete boss from Supabase.');
            return;
        }

        bosses.splice(i, 1);
        render();
    }
}

async function exportImportModal() {
    let action = prompt("Type 'export' to copy data JSON or 'import' to paste data JSON:", "export");
    if (!action) return;

    if (action.toLowerCase() === 'export') {
        prompt("Copy your backup data:", JSON.stringify(bosses));
    } else if (action.toLowerCase() === 'import') {
        let jsonStr = prompt("Paste your backup JSON:");
        if (jsonStr) {
            try {
                let parsed = JSON.parse(jsonStr);
                if (Array.isArray(parsed)) {
                    const cleanData = parsed.map(({ id, created_at, ...rest }) => rest);
                    const { data, error } = await supabaseClient
                        .from('bosses')
                        .insert(cleanData)
                        .select();

                    if (error) throw error;

                    loadBosses();
                    alert("Boss list imported successfully into Supabase!");
                } else {
                    alert("Invalid data format.");
                }
            } catch (err) {
                alert("Failed to import to Supabase: " + err.message);
            }
        }
    }
}

function update() {
    let now = new Date();
    let rows = [...document.querySelectorAll('#tb tr')].filter(r => r.dataset.rawtimes);
    
    const ALLOWANCE_MS = 5 * 60 * 1000;
    const IMMINENT_MS = 15 * 60 * 1000; // Considered "almost there" if within 15 minutes or spawning/spawned

    rows.forEach(r => {
        let rawTimes = r.dataset.rawtimes.split(',');
        
        let dates = rawTimes
            .map(t => parseTimeToTargetTZ(t, currentOffset))
            .filter(Boolean)
            .sort((a, b) => a - b);

        if (dates.length === 0) {
            r.querySelector('.next').textContent = 'Invalid Time';
            r.querySelector('.cd').textContent = '--:--:--';
            r.dataset.diff = 999999999999;
            return;
        }

        let currentOrNextSpawn = dates.find(d => (d - now) > -ALLOWANCE_MS);

        if (!currentOrNextSpawn) {
            currentOrNextSpawn = new Date(dates[0]);
            currentOrNextSpawn.setDate(currentOrNextSpawn.getDate() + 1);
        }

        let diff = currentOrNextSpawn - now;
        const cdEl = r.querySelector('.cd');

        if (diff <= 0 && diff >= -ALLOWANCE_MS) {
            cdEl.textContent = 'SPAWNED!';
            cdEl.className = 'cd due';
        } else {
            let H = Math.floor(diff / 36e5);
            let M = Math.floor((diff % 36e5) / 6e4);
            let S = Math.floor((diff % 6e4) / 1e3);

            cdEl.textContent = `${String(H).padStart(2, '0')}:${String(M).padStart(2, '0')}:${String(S).padStart(2, '0')}`;

            if (diff <= 300000 && diff > 0) {
                cdEl.className = 'cd imminent';
            } else {
                cdEl.className = 'cd';
            }
        }

        r.querySelector('.next').textContent = currentOrNextSpawn.toLocaleTimeString([], {
            hour: 'numeric',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        });

        r.dataset.diff = diff;
    });

    const tb = document.getElementById('tb');
    
    // Updated Sorting Logic:
    // 1. Priority 1: Favorite AND almost there (diff <= 15 minutes or active/spawned) -> Absolute Top.
    // 2. Priority 2: Remaining bosses that are almost spawning (nearest countdowns) -> Top.
    // 3. Priority 3: Other items further away or non-favorites stay below.
    rows.sort((a, b) => {
        let aDiff = Number(a.dataset.diff);
        let bDiff = Number(b.dataset.diff);
        let aFav = a.dataset.favorite === 'true';
        let bFav = b.dataset.favorite === 'true';

        let aIsImminent = aDiff <= IMMINENT_MS && aDiff >= -ALLOWANCE_MS;
        let bIsImminent = bDiff <= IMMINENT_MS && bDiff >= -ALLOWANCE_MS;

        let aTopPriority = (aFav && aIsImminent) ? 1 : 0;
        let bTopPriority = (bFav && bIsImminent) ? 1 : 0;

        if (aTopPriority !== bTopPriority) {
            return bTopPriority - aTopPriority; // Favorite + Imminent goes above everything else
        }

        // Next, sort by nearest countdown time generally
        return aDiff - bDiff;
    });

    rows.forEach(r => tb.appendChild(r));
}

// App Initialization
loadBosses();
subscribeToRealtime();
setInterval(update, 1000);
</script>

</body>
</html>
